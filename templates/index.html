<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salary Predictor</title>
    <style>
        body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #bff5f5, #9be7e7);
    font-family: Arial, sans-serif;
}

/* Card container */
.card {
    background-color: white;
    padding: 40px;
    width: 380px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    text-align: center;
}

/* Heading */
.card h1 {
    margin-bottom: 25px;
    color: #333;
}

/* Input */
.card input {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    margin-top: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

/* Button */
.card button {
    margin-top: 20px;
    padding: 10px;
    width: 100%;
    font-size: 16px;
    background-color: #1aa3a3;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

.card button:hover {
    background-color: #148c8c;
}

/* Salary text */
.result {
    margin-top: 25px;
    font-size: 18px;
    color: #333;
    font-weight: bold;
}

    </style>
</head>
<body>
    <div class="card">
        <h1>Salary Prediction App</h1>

        <form method="post">
            <label>Years of Experience</label>
            <input type="number" step="0.1" name="experiance" required>

            <button type="submit">Predict Salary</button>
        </form>

        {% if salary %}
            <div class="result">
                Predicted Salary: ₹{{ salary }}
            </div>
        {% endif %}
    </div>
</body>

</html>
